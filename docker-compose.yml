version: "3.8"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile # UĹĽyj tego Dockerfile dla dev
    # ports:
    #   - "3000:5173" # Mapuj port hosta 3000 na port kontenera 5173 (Vite)
    volumes:
      - ./frontend:/app # Zamontuj caĹ‚y folder frontend
      - /app/node_modules # Wyklucz wolumen dla node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true" # Czasami potrzebne w Dockerze do Ĺ›ledzenia zmian
    networks:
      - app-network

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      # - ./backend/node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DB_HOST: mysql
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: kapturowo_db
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_MASTER_KEY: kapturowo_meili_secret_key_123!
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app-network
    env_file:
      - ./backend/.env

  mysql:
    image: mysql/mysql-server:8.0.23
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kapturowo_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "3306:3306"

  stripe-cli:
    image: stripe/stripe-cli:latest
    entrypoint: /bin/sh
    command: -c "stripe listen --api-key $$STRIPE_SECRET_KEY --forward-to backend:5000/api/webhook --skip-verify"
    depends_on:
      - backend
    networks:
      - app-network
    env_file:
      - ./backend/.env

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami_password@umami-db:5432/umami
      APP_SECRET: U8Z9X2Y3W4V5U6T7S8R9Q0P1O2N3M4L5
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - app-network

  umami-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_password
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: always
    environment:
      - MEILI_MASTER_KEY=kapturowo_meili_secret_key_123!
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    container_name: kapturowo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: kapturowo-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio
    container_name: kapturowo-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: kapturowadmin
      MINIO_ROOT_PASSWORD: kapturowasecret
    volumes:
      - minio-data:/data
    networks:
      - app-network

volumes:
  mysql_data:
  umami-db-data:
  meilisearch_data:
  uptime-kuma-data:
  minio-data:

networks:
  app-network:
    driver: bridge
